# Every push and pull request: the types, the database tests, and the browser checks.
#
# The browser checks are here on purpose. The database tests can all pass while a screen is broken — proved by
# hiding the converted total on a foreign-currency invoice: all 672 database tests still passed and only the
# browser checks caught it. So a change to a screen cannot reach main on the strength of `npm test` alone.
name: Checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        # The same major version the application runs on: the tests rely on its row-level security and its rounding.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Do NOT add OUTSIDE_CALLS=off or any *_JOBS=off here. They look like harmless safety, but they belong to the
      # tests: test/outside.test.ts sets and restores them itself, and every other test passes its own stand-in for
      # each outside service. Setting them in the job made 26 tests fail and quietly SKIPPED 22 more, which is how
      # the first run of this workflow failed. Nothing in the suite calls a real outside service: every ZATCA,
      # email, bank and exchange-rate call goes to a stand-in the test supplies.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # xmllint, for the e-invoice tests: they canonicalise the invoice with an independent tool and compare it with
      # our own C14N, which is how the ZATCA hash input is verified rather than taken on trust. GitHub's runners
      # carry openssl but not xmllint, and its absence failed three tests on the second run of this workflow.
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: Install dependencies
        run: npm ci

      - name: Check the types
        run: npm run typecheck

      - name: Database and rule tests
        run: npm test

      # Not in package.json: it is only needed for the browser checks, and keeping it out means a normal install
      # never downloads a browser. --no-save leaves package.json and the lock file alone.
      - name: Install Chromium for the browser checks
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Browser checks
        run: npm run test:browser

      - name: Keep the screenshots of a failed browser check
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-screenshots
          path: test-browser/output/
          if-no-files-found: ignore
          retention-days: 7
