<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Nusuh Books</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f7f9;--card:#fff;--ink:#14213d;--mut:#5b6b7b;--teal:#0f766e;--tealbg:#e1f2f0;--line:#d9e6e6;--bad:#b3261e;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a1a;--card:#152727;--ink:#e3f1f0;--mut:#8fb0ae;--teal:#35b9bb;--tealbg:#1b3a3a;--line:#254242;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1a1a;--card:#152727;--ink:#e3f1f0;--mut:#8fb0ae;--teal:#35b9bb;--tealbg:#1b3a3a;--line:#254242;--bad:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:flex;min-height:100vh}
nav{width:200px;background:var(--card);border-inline-end:1px solid var(--line);padding:14px 10px;flex:none}
nav h1{font-size:18px;color:var(--teal);margin:0 6px 12px}
nav button{display:block;width:100%;text-align:start;border:0;background:none;color:var(--ink);padding:9px 10px;border-radius:10px;font:inherit;cursor:pointer}
nav button.on{background:var(--teal);color:#fff;font-weight:600}
main{flex:1;min-width:0;padding:14px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.top h2{margin:0;font-size:20px;flex:1 1 140px}
input,select,button.b{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
button.b{cursor:pointer}button.p{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.fig small{color:var(--mut)}.fig b{display:block;font-size:20px;margin-top:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.row>*{flex:1 1 130px}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:start;font-size:14px}
.num{text-align:end;font-variant-numeric:tabular-nums}.mut{color:var(--mut)}.bad{color:var(--bad)}
.badge{display:inline-block;background:var(--tealbg);color:var(--teal);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600}
.wrap{overflow-x:auto}.brand{margin:0 6px 14px}.brand b{display:block;font-size:18px}.brand span{color:var(--mut);font-size:13px}.b-y{background:#fdf0c8;color:#5c4400}.b-r{background:#fbdcdc;color:#7a1a1a}.b-b{background:#d6e8fb;color:#12406e}.b-g{background:#d4f3e1;color:#0b5a34}.two{display:grid;grid-template-columns:2fr 1fr;gap:12px}.two.eq{grid-template-columns:1fr 1fr}.lst{cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}.lst.on{background:var(--tealbg);border-color:var(--teal)}.full{display:block;width:100%;margin-bottom:8px}.fl{font-size:12px;color:var(--mut)}.fl input,.fl select{display:block;width:100%;font-size:15px;color:var(--ink);margin-top:2px}@media(max-width:700px){.brand{display:none}.two,.two.eq{grid-template-columns:1fr}}
@media(max-width:700px){.app{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;gap:4px;border-inline-end:0;border-bottom:1px solid var(--line);padding:8px}nav h1{display:none}nav button{width:auto;white-space:nowrap}}
</style></head><body>
<div class="app"><nav id="nav"></nav><main id="main"></main></div>
<script>
const T={en:{Home:'Home',Sales:'Sales',Purchases:'Purchases',Bank:'Bank',Inventory:'Inventory',Assets:'Assets',Journal:'Journal',VAT:'VAT',Reports:'Reports',Review:'Review'},

const MODS=Object.keys(T.en);
const CO=[{id:'a',name:'Al Noor Trading',country:'SA',cur:'SAR',vat:15,ei:'ZATCA Fatoora (QR + XML)'},
{id:'b',name:'Marina Café LLC',country:'AE',cur:'AED',vat:5,ei:'Peppol PINT AE via accredited provider'},
{id:'c',name:'Sohar Supplies',country:'OM',cur:'OMR',vat:5,ei:'Fawtara (Peppol model)'}];
const ACC={1000:['Cash in bank','A'],1100:['Accounts receivable','A'],1200:['Input VAT','A'],2000:['Accounts payable','L'],2100:['Output VAT','L'],3000:['Owner’s equity','E'],4000:['Sales','I'],5000:['Operating expenses','X']};

const S={cid:'a',view:'Home',lang:'en',E:{},lock:{},inv:{},sub:{},B:{},sel:0,alt:0,rules:{},at:'Clients',firm:'Demo Accounting Firm',log:[],me:-1,ac:'',msg:'',U:[{name:'Nadia Admin',email:'admin@firm.example',role:'Administrator',kind:'admin',acc:[],tf:true},{name:'Omar Al Harbi',email:'omar@firm.example',role:'Firm partner',kind:'staff',acc:['a','b','c'],tf:true},{name:'Layla Haddad',email:'layla@firm.example',role:'Reviewer',kind:'staff',acc:['a','b'],tf:true},{name:'Rami Saleh',email:'rami@firm.example',role:'Staff accountant',kind:'staff',acc:['c'],tf:false},{name:'Sara Nasser',email:'sara@alnoor.example',role:'Client accountant',kind:'client',acc:['a'],tf:true},{name:'Khalid Al Noor',email:'khalid@alnoor.example',role:'Client management (view only)',kind:'client',acc:['a'],tf:false},{name:'Huda Said',email:'huda@marina.example',role:'Client accountant',kind:'client',acc:['b'],tf:true}]};
CO.forEach(c=>{S.E[c.id]=[];S.lock[c.id]='';S.inv[c.id]=0;S.B[c.id]=[{id:1,n:'Transfer GULF STEEL',d:'26 Oct',amt:12075},{id:2,n:'STC bill payment',d:'25 Oct',amt:-420},{id:3,n:'Transfer RIYADH SUPPLIES',d:'24 Oct',amt:-8300},{id:4,n:'POS deposit',d:'23 Oct',amt:3150}];post(c.id,'2026-10-01','Opening balance',[{a:1000,dr:50000},{a:3000,cr:50000}])});
function co(){return CO.find(c=>c.id===S.cid)}
function r2(x){return Math.round(x*100)/100}
function f(x){return r2(x).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function post(cid,date,memo,lines,src,rev){if(S.me>=0&&!can(cid))return false;
 const dr=r2(lines.reduce((s,l)=>s+(l.dr||0),0)),cr=r2(lines.reduce((s,l)=>s+(l.cr||0),0));
 if(dr!==cr||lines.length<2)return false;
 const e={id:S.E[cid].length+1,date,memo,lines:lines.map(l=>({a:l.a,dr:r2(l.dr||0),cr:r2(l.cr||0),cc:l.cc||''})),src:src||'',rev:rev||0,reversed:false};
 S.E[cid].push(e);lg('Posted entry #'+e.id+' · '+memo,cid);return e}
function bal(a,cid){return r2(S.E[cid||S.cid].reduce((s,e)=>s+e.lines.filter(l=>l.a==a).reduce((t,l)=>t+l.dr-l.cr,0),0))}
function locked(d){if(!canPost())return true;const l=S.lock[S.cid];return l&&d<=l}

 document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';

 const c=co();

 document.getElementById('main').innerHTML=`<div class="top"><h2>${S.view==='Home'?(S.lang==='ar'?'صباح الخير، سارة':'Good morning, '+S.U[S.me].name.split(' ')[0]):T[S.lang][S.view]}</h2>
 ${S.U[S.me].kind==='staff'?'<button class="b" onclick="leave()">← My clients</button>':''}<span class="badge">${co().logo?`<img src="${co().logo}" style="height:18px;vertical-align:middle;margin-inline-end:6px;border-radius:4px">`:''}${esc(co().name)}</span>
 <span class="mut">${esc(S.U[S.me].name)} · ${S.U[S.me].role}</span><button class="b" onclick="signout()">Sign out</button><input id="q" placeholder="Search invoices, customers, amounts" oninput="search(this.value)" style="flex:1 1 180px">
 <button class="b" onclick="S.lang=S.lang==='en'?'ar':'en';render()">EN | AR</button>
 <button class="b" onclick="theme()">◐</button>${act}</div>${canPost()?'':'<div class="card mut">View only: your role cannot post entries.</div>'}<div id="v"></div>`;
 V[S.view]?V[S.view]():V.soon()}

 document.getElementById('v').innerHTML=`<div class="card"><b>${hits.length} result(s)</b>${hits.map(e=>`<div>#${e.id} · ${esc(e.memo)} · ${e.date}</div>`).join('')}</div>`}
const V={
Home(){const c=co(),inc=-bal(4000),ex=bal(5000),E=S.E[S.cid],open=E.filter(e=>e.src==='inv'&&!e.paid&&!e.reversed).length,un=bk().filter(x=>!x.done).length,nb=E.filter(e=>e.src==='bill').length,fig=[['Cash in bank',bal(1000),'from the ledger'],['Receivables',bal(1100),open+' invoices open'],['Payables',-bal(2000),nb+' bills on account'],['Profit this month',inc-ex,'sales less expenses']],td=[['Match bank lines to invoices and bills',un,'b-y','Bank'],['Invoices awaiting payment',open,'b-r','Sales'],['Bills on account',nb,'b-y','Purchases'],['Queries from your reviewer',2,'b-b','Review'],['VAT return due 30 Nov','Draft','b-g','VAT']];v(`<div class="grid">${fig.map(x=>`<div class="card fig"><small>${x[0]}</small><b>${c.cur} ${f(x[1])}</b><small>${x[2]}</small></div>`).join('')}</div><div class="two"><div class="card"><b>To do today</b><table>${td.map(x=>`<tr><td>${x[0]}</td><td class="num"><span class="badge ${x[2]}">${x[1]}</span></td><td class="num"><a href="#" style="color:var(--teal);font-weight:600;text-decoration:none" onclick="go('${x[3]}');return false">Open</a></td></tr>`).join('')}</table></div><div class="card"><b>Quick actions</b><div style="margin-top:8px"><button class="b p full" onclick="go('Sales')">New invoice</button><button class="b full" onclick="go('Sales')">Record money received</button><button class="b full" onclick="go('Purchases')">Add bill</button><button class="b full" onclick="go('Bank')">Import bank statement</button></div></div></div><div class="mut">${S.lock[S.cid]?'Books locked up to '+S.lock[S.cid]:'October 2026 is open'}. Reviewer sign-off: not started.</div>`)},
Bank(){const c=co(),L=bk(),op=L.filter(x=>!x.done),s=op.find(x=>x.id===S.sel)||op[0],diff=r2(op.reduce((t,x)=>t+x.amt,0));let right='<div class="mut">All bank lines are matched.</div>';if(s){const pos=s.amt>0,tot=e=>pos?e.lines[0].dr:e.lines[2].cr,cand=S.E[S.cid].filter(e=>e.src===(pos?'inv':'bill')&&!e.paid&&!e.reversed),i0=Math.max(cand.findIndex(e=>tot(e)===Math.abs(s.amt)),0),m=cand.length?cand[(i0+S.alt)%cand.length]:null,ok=m&&tot(m)===Math.abs(s.amt);right=`<b>Suggested match</b><div class="card" style="margin:10px 0">${m?`${pos?'Invoice':'Bill'} ${esc(m.memo)}<div class="mut">${ok?'Amount '+f(tot(m))+' matches exactly.':'Amount '+f(tot(m))+' does not match this line, so it cannot be confirmed.'}</div>`:`<span class="mut">No open ${pos?'invoice':'bill'} to match. Issue one first, or categorise below.</span>`}</div><button class="b p" ${ok?'':'disabled'} onclick="confirmM(${s.id},${m?m.id:0})">Confirm match</button> <button class="b" ${cand.length>1?'':'disabled'} onclick="alt()">Find another</button><div style="margin:12px 0 6px">Or categorise: ${(pos?['Other income']:['Telephone','Rent','Salaries','Other']).map(n=>`<button class="b" onclick="cat(${s.id},'${n}')">${n}</button>`).join(' ')}</div><label class="mut"><input type="checkbox" id="al"> Always do this for ${esc(s.n)}</label>`}v(`<div class="two eq"><div class="card"><b>Bank lines to match (${op.length})</b><div style="margin-top:8px">${op.map(x=>`<div class="lst ${x.id===s.id?'on':''}" onclick="sel(${x.id})"><b>${esc(x.n)}</b><span style="float:inline-end"><b>${x.amt>0?'+':''}${f(x.amt)}</b></span><div class="mut">${x.d}</div></div>`).join('')||'<div class="mut">Nothing to match.</div>'}</div></div><div class="card">${right}</div></div><div class="mut">Statement balance ${f(bal(1000)+diff)} | Books balance ${f(bal(1000))} | Difference ${f(diff)} ${c.cur}</div>`)},
HomeOld(){const c=co(),inc=-bal(4000),ex=bal(5000);
 const open=S.E[S.cid].filter(e=>e.src==='inv'&&!e.paid&&!e.reversed).length;
 v(`<div class="grid">${[['Cash in bank',bal(1000)],['Receivables',bal(1100)],['Payables',-bal(2000)],['Profit this month',inc-ex]].map(x=>`<div class="card fig"><small>${x[0]}</small><b>${f(x[1])}</b><small>${c.cur}</small></div>`).join('')}</div>
 <div class="card"><b>To do today</b><table><tr><td>Bank lines to match</td><td class="num"><span class="badge">3 (demo)</span></td></tr>
 <tr><td>Invoices awaiting payment</td><td class="num">${open}</td></tr>
 <tr><td>VAT payable now</td><td class="num">${f(-bal(2100)-bal(1200))} ${c.cur}</td></tr>
 <tr><td>Reviewer queries</td><td class="num mut">0</td></tr></table></div>
 <div class="card"><b>Quick actions</b><div class="row" style="margin-top:8px"><button class="b" onclick="go('Sales')">New invoice</button><button class="b" onclick="go('Purchases')">Add bill</button><button class="b" onclick="go('Bank')">Import bank statement</button><button class="b" onclick="go('Inventory')">Add stock item</button></div></div>`)},
Sales(){const c=co(),s=S.sub;s.lines=s.lines||[{d:'',q:1,p:0}];s.date=s.date||TODAY;
 const sub=r2(s.lines.reduce((t,l)=>t+l.q*l.p,0)),vat=r2(sub*c.vat/100),tot=r2(sub+vat),bad=locked(s.date);
 const list=S.E[S.cid].filter(e=>e.src==='inv');
 v(`<div class="card">
 <div class="row" style="margin-top:10px"><input placeholder="Customer" value="${esc(s.cust||'')}" oninput="S.sub.cust=this.value"><input placeholder="Customer tax number" value="${esc(s.trn||'')}" oninput="S.sub.trn=this.value"></div>
 <div class="row"><label>Invoice date<input type="date" value="${s.date}" onchange="S.sub.date=this.value;render()"></label><label>Due date<input type="date" value="${s.due||dd(s.date,c.terms||30)}" onchange="S.sub.due=this.value"></label><label>Cost centre<select onchange="S.sub.cc=this.value">${CC.map(x=>`<option ${x===s.cc?'selected':''}>${x}</option>`).join('')}</select></label></div>
 <div class="mut" style="margin-bottom:6px">Invoice no. ${c.prefix||'INV'}-${String(S.inv[S.cid]+1).padStart(4,'0')}</div>
 <div class="wrap"><table><tr><th>Description</th><th>Qty</th><th>Price</th><th>VAT</th><th class="num">Amount</th></tr>${s.lines.map((l,i)=>`<tr><td><input value="${esc(l.d)}" oninput="S.sub.lines[${i}].d=this.value"></td><td><input type="number" min="0" style="width:70px" value="${l.q}" onchange="S.sub.lines[${i}].q=+this.value;render()"></td><td><input type="number" min="0" style="width:100px" value="${l.p}" onchange="S.sub.lines[${i}].p=+this.value;render()"></td><td>${c.vat}% Standard</td><td class="num">${f(l.q*l.p)}</td></tr>`).join('')}</table></div>
 <button class="b" onclick="S.sub.lines.push({d:'',q:1,p:0});render()">+ Add line</button>
 <div style="display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;margin-top:14px"><div class="mut" style="flex:1 1 240px"><span class="badge b-g">${c.country==='SA'?'ZATCA ready: QR and XML created on issue':c.ei}</span><div style="margin-top:6px">Posts to: Sales income, VAT payable, Receivables</div></div><div style="flex:0 1 280px"><table><tr><td>Subtotal</td><td class="num">${f(sub)}</td></tr><tr><td>VAT ${c.vat}%</td><td class="num">${f(vat)}</td></tr><tr><td><b>Total (${c.cur})</b></td><td class="num"><b>${f(tot)}</b></td></tr></table></div></div>
 <div class="mut" style="margin:8px 0">Dr Accounts receivable ${f(tot)} · Cr Sales ${f(sub)} · Cr Output VAT ${f(vat)}. Issued invoices are never edited; use a reversal.${s.saved?' Draft saved.':''}</div>
 ${bad?'<div class="bad" style="margin-bottom:8px">'+(canPost()?'This date falls in a locked period. Pick a later date.':'Your role is view only, so you cannot post.')+'</div>':''}
 </div>
 <div class="card"><b>Issued invoices</b><div class="wrap"><table>${list.map(e=>`<tr><td>${esc(e.memo)}</td><td>${e.date}</td><td class="num">${f(e.lines[0].dr)}</td><td class="num">${e.reversed?'<span class="mut">Reversed</span>':e.paid?'<span class="badge">Paid</span>':`<button class="b" onclick="pay(${e.id})">Receive payment</button>`}</td></tr>`).join('')||'<tr><td class="mut">None yet</td></tr>'}</table></div></div>`)},

 v(`<div class="card"><b>Add bill</b><div class="row" style="margin-top:10px"><input placeholder="Supplier" value="${esc(s.sup||'')}" oninput="S.sub.sup=this.value"><input type="number" min="0" placeholder="Amount before VAT" value="${s.amt||''}" oninput="S.sub.amt=+this.value;document.getElementById('bt').textContent=f(S.sub.amt*(1+co().vat/100))"><select onchange="S.sub.cc=this.value">${CC.map(x=>`<option>${x}</option>`).join('')}</select></div>
 <div class="mut">Total with ${c.vat}% input VAT: <span id="bt">${f((s.amt||0)*(1+c.vat/100))}</span> ${c.cur}. Posts to: Dr Expenses, Dr Input VAT, Cr Accounts payable.</div>
 <button class="b p" style="margin-top:10px" onclick="bill()">Save bill</button></div>

Journal(){const c=co();
 v(`<div class="card"><b>Period lock</b><div class="row" style="margin-top:8px"><label>Lock all dates up to<input type="date" value="${S.lock[S.cid]}" ${S.U[S.me].role==='Firm partner'?'':'disabled'} onchange="setLock(this.value)"></label></div><div class="mut">Posting or reversing into locked dates is blocked.</div></div>
 ${S.E[S.cid].slice().reverse().map(e=>`<div class="card"><b>#${e.id} · ${esc(e.memo)}</b> <span class="mut">${e.date}</span>${e.reversed?' <span class="badge">Reversed</span>':''}${e.rev?' <span class="badge">Reversal of #'+e.rev+'</span>':''}
 <table>${e.lines.map(l=>`<tr><td>${l.a} ${ACC[l.a][0]}${l.cc?' <span class="mut">['+l.cc+']</span>':''}</td><td class="num">${l.dr?f(l.dr):''}</td><td class="num">${l.cr?f(l.cr):''}</td></tr>`).join('')}</table>
 ${e.reversed||e.rev?'':`<button class="b" ${locked(TODAY)?'disabled':''} onclick="reverse(${e.id})">Reverse</button>`}</div>`).join('')}`)},

 v(`<div class="card"><b>VAT summary · ${c.country} · ${c.vat}%</b><table><tr><td>Output VAT (sales)</td><td class="num">${f(o)}</td></tr><tr><td>Input VAT (purchases)</td><td class="num">${f(i)}</td></tr><tr><td><b>Net VAT due</b></td><td class="num"><b>${f(o-i)} ${c.cur}</b></td></tr></table><div class="mut">Return filing per country comes later.</div></div>`)},
Reports(){const c=co();let d=0,k=0;
 const rows=Object.keys(ACC).map(a=>{const b=bal(a);const dr=b>0?b:0,cr=b<0?-b:0;d+=dr;k+=cr;return `<tr><td>${a} ${ACC[a][0]}</td><td class="num">${dr?f(dr):''}</td><td class="num">${cr?f(cr):''}</td></tr>`}).join('');

Staff(){const stf=S.U.map((u,i)=>[u,i]).filter(x=>x[0].kind==='staff'),R=['Firm partner','Reviewer','Staff accountant','Client accountant','Client management'],caps=[['Post entries',[1,0,1,1,0]],['Review and sign off',[1,1,0,0,0]],['Lock periods',[1,0,0,0,0]],['View reports',[1,1,1,1,1]]];return `<div class="card"><b>Firm staff (${stf.length})</b><div class="mut" style="margin:4px 0">Tick the clients each person handles. Staff only ever see the clients ticked here.</div><div class="wrap"><table><tr><th>Name</th><th>Role</th><th>Clients handled</th><th></th></tr>${stf.map(x=>{const u=x[0],i=x[1];return `<tr><td>${esc(u.name)}${u.off?' <span class="badge b-r">Suspended</span>':''}<div class="mut">${esc(u.email)} · 2FA ${u.tf?'on':'off'}</div></td><td>${u.role}</td><td>${CO.map(c=>`<label style="display:block"><input type="checkbox" ${u.acc.includes(c.id)?'checked':''} onchange="togAcc(${i},'${c.id}',this.checked)"> ${esc(c.name)}</label>`).join('')}</td><td class="num"><button class="b" onclick="togU(${i})">${u.off?'Reactivate':'Suspend'}</button></td></tr>`}).join('')}</table></div></div><div class="card"><b>Add staff</b><div class="row" style="margin-top:8px"><input id="sn" placeholder="Full name"><input id="se" placeholder="Email"><select id="sr">${STAFF_ROLES.map(r=>`<option>${r}</option>`).join('')}</select></div><div class="mut" style="margin-bottom:6px">Clients they will handle</div><div class="row">${CO.map(c=>`<label style="flex:0 0 auto"><input type="checkbox" class="sx" value="${c.id}"> ${esc(c.name)}</label>`).join('')}</div><button class="b p" onclick="addS()">Add staff</button></div><div class="card"><b>What each role can do</b><div class="wrap"><table><tr><th></th>${R.map(r=>`<th>${r}</th>`).join('')}</tr>${caps.map(c=>`<tr><td>${c[0]}</td>${c[1].map(x=>`<td>${x?'✓':'–'}</td>`).join('')}</tr>`).join('')}</table></div><div class="mut">Only the Administrator adds clients, staff and users.</div></div>`}};
const LF=['LLC','Sole establishment','Joint stock company','Partnership','Branch of foreign company','Other'],MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const CH={SA:{cr:'Commercial registration (CR) number *',crp:'10 digits',vn:'VAT number',vp:'15 digits, starts and ends with 3',cur:'SAR',vat:15,ei:'ZATCA Fatoora (QR + XML)'},AE:{cr:'Trade licence number *',crp:'As on the licence',vn:'Tax registration number (TRN)',vp:'15 digits',cur:'AED',vat:5,ei:'Peppol PINT AE via accredited provider'},OM:{cr:'Commercial registration (CR) number *',crp:'As on the CR',vn:'VAT number',vp:'As on the certificate',cur:'OMR',vat:5,ei:'Fawtara (Peppol model)'}};
function err(m){const e=document.getElementById('err');if(e)e.textContent=m}
function vatTog(){const u=val('r-vr')==='U',i=document.getElementById('r-vn');i.disabled=u;if(u)i.value=''}
function ctry(){const h=CH[val('nk')];document.getElementById('crl').textContent=h.cr;document.getElementById('vnl').textContent=h.vn+' *';document.getElementById('r-cr').placeholder=h.crp;document.getElementById('r-vn').placeholder=h.vp;document.getElementById('ci').textContent='Currency '+h.cur+' · VAT rate '+h.vat+'% · E-invoicing: '+h.ei}
function logoPick(inp){const f=inp.files[0];if(!f)return;if(f.size>300000){err('The logo is too large. Use an image under 300 KB.');inp.value='';return}const r=new FileReader();r.onload=()=>{S.tmpLogo=r.result;document.getElementById('lp').src=r.result;err('')};r.readAsDataURL(f)}
function regForm(c,k){const h=CH[k],vr=c.vatReg===false?'U':'R',i=(id,v,x)=>`<input id="${id}" value="${esc(v||'')}" ${x||''}>`;return `<div class="row"><label class="fl">Company name in Arabic${i('r-ar',c.ar,'dir="rtl"')}</label><label class="fl">Trade name${i('r-tn',c.tn)}</label></div><div class="row"><label class="fl">Legal form *<select id="r-lf">${LF.map(x=>`<option ${c.lf===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="fl"><span id="crl">${h.cr}</span><input id="r-cr" placeholder="${h.crp}" value="${esc(c.cr||'')}"></label><label class="fl">CR or licence expiry<input id="r-ce" type="date" value="${c.crExp||''}"></label></div><div class="row"><label class="fl">VAT status *<select id="r-vr" onchange="vatTog()"><option value="R" ${vr==='R'?'selected':''}>VAT registered</option><option value="U" ${vr==='U'?'selected':''}>VAT unregistered</option></select></label><label class="fl"><span id="vnl">${h.vn} *</span><input id="r-vn" placeholder="${h.vp}" value="${esc(c.vatNo||'')}" ${vr==='U'?'disabled':''}></label><label class="fl">VAT registration date<input id="r-vd" type="date" value="${c.vatDate||''}"></label></div><div class="row"><label class="fl">Address *${i('r-ad',c.addr)}</label><label class="fl">City *${i('r-ci',c.city)}</label></div><div class="row"><label class="fl">Phone${i('r-ph',c.phone)}</label><label class="fl">Company email${i('r-em',c.email)}</label><label class="fl">Website${i('r-wb',c.web)}</label></div><div class="row"><label class="fl">Financial year ends *<select id="r-fy">${MON.map((m,n)=>`<option value="${n+1}" ${(c.fy||12)===n+1?'selected':''}>${m}</option>`).join('')}</select></label><label class="fl">Logo (PNG or JPG, under 300 KB)<input type="file" accept="image/*" onchange="logoPick(this)"></label><div style="flex:0 0 80px"><img id="lp" ${S.tmpLogo||c.logo?`src="${S.tmpLogo||c.logo}"`:''} style="max-height:56px;max-width:100%"></div></div><div class="mut">VAT unregistered means invoices are issued without VAT (rate 0%).</div>`}
function readReg(k){const g=id=>val(id).trim(),vr=g('r-vr')==='R',cr=g('r-cr'),vn=g('r-vn'),em=g('r-em');if(!cr)return 'Enter the '+(k==='AE'?'trade licence':'CR')+' number.';if(k==='SA'&&!/^\d{10}$/.test(cr))return 'A Saudi CR number has 10 digits.';if(vr){if(!vn)return 'Enter the VAT number, or choose VAT unregistered.';if(k==='SA'&&!/^3\d{13}3$/.test(vn))return 'A Saudi VAT number has 15 digits, starting and ending with 3.';if(k==='AE'&&!/^\d{15}$/.test(vn))return 'A UAE TRN has 15 digits.'}if(!g('r-ad')||!g('r-ci'))return 'Enter the address and city.';if(em&&!em.includes('@'))return 'The company email looks wrong.';return{ar:g('r-ar'),tn:g('r-tn'),lf:g('r-lf'),cr,crExp:g('r-ce'),vatReg:vr,vatNo:vr?vn:'',vatDate:g('r-vd'),addr:g('r-ad'),city:g('r-ci'),phone:g('r-ph'),email:em,web:g('r-wb'),fy:+g('r-fy')}}
function addC(){const n=val('nn').trim(),k=val('nk'),un=val('cn').trim(),ue=val('ce').trim();if(!n)return err('Enter the company name.');const r=readReg(k);if(typeof r==='string')return err(r);if(CO.some(x=>x.cr===r.cr))return err('A client with this registration number already exists.');if(r.vatNo&&CO.some(x=>x.vatNo===r.vatNo))return err('A client with this VAT number already exists.');if(!un||!ue.includes('@'))return err('Enter the first client user: a name and a valid email.');const h=CH[k],id='k'+(CO.length+1);CO.push({id,name:n,country:k,cur:h.cur,vat:r.vatReg?h.vat:0,ei:h.ei,plan:val('np'),managed:document.getElementById('nm').checked,notes:val('nt'),status:'Active',logo:S.tmpLogo||'',...r});S.E[id]=[];S.lock[id]='';S.inv[id]=0;S.B[id]=[];S.U.push({name:un,email:ue,role:val('cr'),kind:'client',acc:[id],tf:false});document.querySelectorAll('.sa').forEach(x=>{if(x.checked)S.U[+x.value].acc.push(id)});S.tmpLogo='';lg('Added client '+n,'');S.ac=id;render()}
function saveReg(id){const c=CO.find(x=>x.id===id),r=readReg(c.country);if(typeof r==='string')return err(r);if(CO.some(x=>x.id!==id&&x.cr===r.cr))return err('Another client already has this registration number.');if(r.vatNo&&CO.some(x=>x.id!==id&&x.vatNo===r.vatNo))return err('Another client already has this VAT number.');Object.assign(c,r);if(S.tmpLogo)c.logo=S.tmpLogo;c.vat=r.vatReg?(c.vat||CH[c.country].vat):0;S.tmpLogo='';lg('Updated registration details for '+c.name,'');render()}
function saveC(id){const c=CO.find(x=>x.id===id);c.name=val('cs-n').trim()||c.name;c.plan=val('cs-p');if(S.E[id].length<=1)c.cur=val('cs-c').trim()||c.cur;c.vat=c.vatReg===false?0:(+val('cs-v')||0);c.notes=val('cs-t');c.managed=document.getElementById('cs-m').checked;lg('Updated settings for '+c.name,'');render()}
function crow(q){q=(q||'').toLowerCase();return CO.filter(c=>!q||[c.name,c.ar,c.cr,c.vatNo,c.country].join(' ').toLowerCase().includes(q)).map(c=>{const st=c.status||'Active';return `<tr><td>${c.logo?`<img src="${c.logo}" style="height:24px;vertical-align:middle;margin-inline-end:8px;border-radius:4px">`:''}${esc(c.name)}</td><td>${c.country}</td><td>${esc(c.cr||'–')}</td><td>${c.vatReg===false?'Unregistered':esc(c.vatNo||'–')}</td><td><span class="badge ${st==='Active'?'b-g':'b-r'}">${st}</span></td><td class="num"><button class="b p" onclick="S.ac='${c.id}';render()">Manage</button></td></tr>`}).join('')||'<tr><td class="mut">No clients match</td></tr>'}
function fc(q){S.cq=q;document.getElementById('cl').innerHTML=crow(q)}
AD.Clients=function(){return `<div class="grid"><div class="card fig"><small>Total clients</small><b>${CO.length}</b><small>${CO.filter(c=>(c.status||'Active')==='Active').length} active</small></div></div><div class="top" style="margin-bottom:10px"><input placeholder="Search by name, CR or VAT number" value="${esc(S.cq||'')}" oninput="fc(this.value)" style="flex:1 1 220px"><button class="b p" onclick="S.ac='new';S.tmpLogo='';render()">+ Add client</button></div><div class="card"><div class="wrap"><table><tr><th>Client</th><th>Country</th><th>CR no.</th><th>VAT</th><th>Status</th><th></th></tr><tbody id="cl">${crow(S.cq)}</tbody></table></div></div>`};
AD.Detail=function(){const c=CO.find(x=>x.id===S.ac),o=AD.DetailOld();return o.replace('<div class="card"><b>Entry settings</b>',()=>`<div class="card"><b>Registration and tax</b><div id="err" class="bad"></div><div style="margin-top:8px">${regForm(c,c.country)}</div><button class="b p" onclick="saveReg('${c.id}')">Save registration details</button></div><div class="card"><b>Entry settings</b>`)};
AD.New=function(){const stf=S.U.map((u,i)=>[u,i]).filter(x=>x[0].kind==='staff'),h=CH.SA;return `<button class="b" style="margin-bottom:10px" onclick="S.ac='';render()">← All clients</button><div id="err" class="bad" style="margin-bottom:8px"></div><div class="card"><b>1. Company</b> <span class="mut">Fields marked * are required</span><div class="row" style="margin-top:8px"><label class="fl">Company name *<input id="nn"></label><label class="fl">Country *<select id="nk" onchange="ctry()"><option value="SA">Saudi Arabia</option><option value="AE">UAE (Dubai)</option><option value="OM">Oman</option></select></label><label class="fl">Plan<select id="np"><option>Pilot</option><option>Standard</option></select></label></div><div class="mut" id="ci">Currency ${h.cur} · VAT rate ${h.vat}% · E-invoicing: ${h.ei}</div><div class="row" style="margin-top:8px"><input id="nt" placeholder="Compliance notes (optional)"><label class="mut" style="flex:0 0 auto"><input type="checkbox" id="nm"> Managed service</label></div></div><div class="card"><b>2. Registration and tax</b><div style="margin-top:8px">${regForm({},'SA')}</div></div><div class="card"><b>3. First client user</b> <span class="mut">Required</span><div class="row" style="margin-top:8px"><label class="fl">Full name *<input id="cn"></label><label class="fl">Email *<input id="ce"></label><label class="fl">Role<select id="cr">${CLIENT_ROLES.map(r=>`<option>${r}</option>`).join('')}</select></label></div></div><div class="card"><b>4. Staff who will handle this client</b> <span class="mut">Optional, can be changed later</span><div class="row" style="margin-top:8px">${stf.map(x=>`<label style="flex:0 0 auto"><input type="checkbox" class="sa" value="${x[1]}"> ${esc(x[0].name)}</label>`).join('')}</div></div><button class="b p" onclick="addC()">Add client</button>`};
function issue(){const s=S.sub,c=co(),sub=r2(s.lines.reduce((t,l)=>t+l.q*l.p,0)),vat=r2(sub*c.vat/100);if(sub<=0||locked(s.date))return;
 const no=(c.prefix||'INV')+'-'+String(++S.inv[S.cid]).padStart(4,'0');
 const e=post(S.cid,s.date,no+' · '+(s.cust||'Customer'),[{a:1100,dr:r2(sub+vat)},{a:4000,cr:sub,cc:s.cc||CC[0]},{a:2100,cr:vat}],'inv');S.sub={};go('Sales')}
function pay(id){const e=S.E[S.cid].find(x=>x.id===id);if(locked(TODAY))return;e.paid=true;post(S.cid,TODAY,'Receipt for '+e.memo,[{a:1000,dr:e.lines[0].dr},{a:1100,cr:e.lines[0].dr}],'rcpt');render()}
function bill(){const s=S.sub,c=co();if(!s.amt||locked(TODAY))return;const vat=r2(s.amt*c.vat/100);
 post(S.cid,TODAY,'Bill · '+(s.sup||'Supplier'),[{a:5000,dr:s.amt,cc:s.cc||CC[0]},{a:1200,dr:vat},{a:2000,cr:r2(s.amt+vat)}],'bill');S.sub={};render()}
function reverse(id){const e=S.E[S.cid].find(x=>x.id===id);if(locked(TODAY))return;
 post(S.cid,TODAY,'Reversal of #'+id+' · '+e.memo,e.lines.map(l=>({a:l.a,dr:l.cr,cr:l.dr,cc:l.cc})),'rev',id);e.reversed=true;render()}
render();
</script></body></html>
