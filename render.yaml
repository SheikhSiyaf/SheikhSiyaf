# How Nusuh Books is deployed, declared here rather than typed into a dashboard.
#
# Render reads this file (a "Blueprint") and creates the service with exactly these settings, so a deploy can be
# repeated, reviewed in a pull request, and rebuilt from scratch if the service is ever lost. Nothing secret is in
# this file: every credential is marked `sync: false`, which means Render asks for the value and keeps it in the
# service's own settings. Secrets never belong in the repository.
#
# The database is NOT declared here. It lives on Neon (PostgreSQL), and its connection strings arrive as the
# variables below.
#
# To use it: in the Render Dashboard choose New > Blueprint, pick this repository, and Render will prompt for each
# `sync: false` value. Note Render's own caveat: it prompts for those values only when the Blueprint is FIRST
# created. Later changes to them are made in the service's Environment settings.

services:
  - type: web
    name: nusuh-books
    runtime: node
    # Frankfurt is the closest region Render offers to Saudi Arabia and the UAE, and the EU keeps the options open
    # for data-protection rules. A service's region cannot be changed afterwards.
    region: frankfurt
    # The owner's decision (2026-11-22): the paid Starter plan, 0.5c-512mb ($7/month, 0.5 CPU, 512 MB). It does not
    # sleep, so queued email, payment reminders, recurring invoices and e-invoice reporting keep running. Change the plan
    # here, never only in the dashboard: the Blueprint sync would put it back.
    plan: 0.5c-512mb
    # `branch` is deliberately not set: Render uses the repository's default branch, or whichever branch is chosen
    # when the Blueprint is created. Set it there rather than pinning a branch name in this file.

    # --include=dev is required, not optional. NODE_ENV=production below makes npm skip devDependencies, and the
    # build needs typescript and vite, which are devDependencies. Without it the build fails with a missing tsc.
    # The migration runs here, at the end of the build, because Render's preDeployCommand — the proper place for it
    # — is only available on paid plans. The effect is the same: it finishes before the new version serves. Every
    # migration is additive and recorded in schema_migrations, so it is applied once however often this runs, and a
    # failure stops the deploy rather than leaving the schema half-changed.
    # On a paid plan, move the migration back out into:  preDeployCommand: npm run db:migrate:prod
    buildCommand: npm ci --include=dev && npm run build:prod && npm run db:migrate:prod && (npm run db:install:prod || echo "No owner link made - set OWNER_NAME and OWNER_EMAIL to make one")
    # The last step makes the first owner's one-time sign-in link and prints it in this build's log. It is how the owner
    # gets in on a plan with no shell. It does nothing once the owner has chosen a password, and it never sets or prints
    # a password. Remove OWNER_NAME and OWNER_EMAIL after the owner has signed in.

    # Plain node on compiled JavaScript. Never `npm start`: that runs the TypeScript through tsx, which is a
    # devDependency and is not installed at runtime.
    startCommand: npm run start:prod

    # /health reports the database and every background job, and answers 503 when one is failing or overdue, so
    # Render replaces an instance that is up but not working. It contains no customer data.
    healthCheckPath: /health

    # Deploy only when the GitHub checks pass: the types, the 689 tests and the browser checks. A commit that
    # breaks them never reaches the clients.
    autoDeployTrigger: checksPass

    envVars:
      # NODE_ENV=production turns on the start-up checks in src/config.ts: the server refuses to start with a
      # missing or example secret, with demo sign-in on, or connecting as a superuser.
      # Everything is built and tested on Node 22. package.json only says "22 or newer", so without this Render picks
      # the newest release (it chose 26 on the first real deploy). Render reads this one itself; the code never does.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Listen on every network address. The app's own default, 127.0.0.1, means "this machine only", which is right on
      # a laptop but leaves Render's front door nothing to connect to: the deploy builds, then times out with "no
      # open ports detected". Render supplies PORT itself.
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        # Render puts one proxy in front of the service. Without this every visitor appears to come from the
        # proxy's address, so one person's wrong passwords would lock everyone out of signing in.
        value: "1"
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_LOGINS
        value: "false"

      # The address the service is reached at, used in links in emails. Must start with https://.
      - key: PUBLIC_URL
        sync: false

      # Neon. Use the DIRECT connection string (not the one with "-pooler" in the host name): the background jobs rely
      # on a connection that stays the same for the whole session. The login is nusuh_app, so row-level security
      # applies to the server. Its password must match APP_DB_PASSWORD below.
      - key: DATABASE_URL
        sync: false
      # Only the migration uses this, as the database's owner role. The running server never does.
      - key: DATABASE_ADMIN_URL
        sync: false
      # The password the migration sets on the nusuh_app role; it must match the one in DATABASE_URL.
      - key: APP_DB_PASSWORD
        sync: false

      # Signs sign-in cookies. Render generates a random 256-bit value once, when the service is created, and keeps it;
      # nobody has to invent or paste it. Changing it later only signs everyone out.
      - key: SESSION_SECRET
        generateValue: true
      # Encrypts two-factor and provider secrets in the database. A DIFFERENT random value from SESSION_SECRET,
      # and never changed once there is real data, or those secrets can no longer be read. Generated by Render like
      # the one above. AFTER THE FIRST DEPLOY copy this value from the service's Environment tab into a password
      # manager: if the service is ever deleted and rebuilt, the same key is needed to read the stored secrets.
      - key: ENCRYPTION_KEY
        generateValue: true

      # Who the first owner is. Used only to print a one-time link to choose a password; see buildCommand.
      - key: OWNER_NAME
        sync: false
      - key: OWNER_EMAIL
        sync: false

      # Email. Leave EMAIL_PROVIDER unset until the sending domain is verified: until then messages simply wait in
      # the outbox and nothing is sent to anyone.
      - key: EMAIL_PROVIDER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      # Demo mode (the platform owner's button): the address of the separate demo site (render-demo.yaml), and a secret shared with
      # it so the button can open it with a short-lived signed link. Leave both unset until the demo site exists; the
      # button then says it is not set up. The secret is the same value on both services (40+ random characters).
      - key: DEMO_SITE_URL
        sync: false
      - key: DEMO_LINK_SECRET
        sync: false
