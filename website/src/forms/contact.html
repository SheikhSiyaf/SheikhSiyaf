<form class="js-form" data-form="contact" action="/api/submit.php" method="post" novalidate>
<input type="hidden" name="type" value="contact">
<div class="nb-hp" aria-hidden="true"><label>Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
<div class="ct-f">
  <label>Name<input type="text" name="name" autocomplete="name" required maxlength="120"></label>
  <label>Email<input type="email" name="email" autocomplete="email" required maxlength="160"></label>
  <label>Message<textarea name="message" rows="5" required maxlength="4000"></textarea></label>
</div>
<p class="form-msg" role="alert" data-error hidden></p>
<p class="form-msg ok" role="status" data-ok hidden></p>
<div class="ct-acts"><button type="submit" class="btn btn-ink">Send message<span class="arr">→</span></button></div>
</form>
