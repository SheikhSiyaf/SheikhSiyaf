<form class="js-form" data-form="demo" action="/api/submit.php" method="post" novalidate>
<input type="hidden" name="type" value="demo">
<div class="nb-hp" aria-hidden="true"><label>Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
<div class="ct-f">
  <label>Name<input type="text" name="name" autocomplete="name" required maxlength="120"></label>
  <label>Email<input type="email" name="email" autocomplete="email" required maxlength="160"></label>
  <label>Company and industry<input type="text" name="company" autocomplete="organization" required maxlength="160"></label>
  <label>Team size<input type="text" name="teamSize" maxlength="60"></label>
</div>
<p class="form-msg" role="alert" data-error hidden></p>
<p class="form-msg ok" role="status" data-ok hidden></p>
<div class="ct-acts"><button type="submit" class="btn btn-ink">Request a demo<span class="arr">→</span></button></div>
</form>
